# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=pigeon-messenger

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pigeon}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Configuration
# No committed default: the application refuses to start without JWT_SECRET so a
# real deployment cannot inherit a secret that is public in git history. The demo
# profile supplies a throwaway development value.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS / WebSocket origins. Override per environment; the defaults are local dev
# only and will block every request from a real domain until set.
# 5173 is the dev server, 4173 the preview server that serves the production
# bundle, 3000 the nginx container.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Pigeon Message rules
# One meaningful message per day is the core product mechanic, enforced here
# rather than in the client where it would be trivially bypassable.
pigeon.daily-limit=${PIGEON_DAILY_LIMIT:1}
pigeon.allow-daily-reset=${PIGEON_ALLOW_DAILY_RESET:false}

# Flight timing. Real duration is distance / airspeed; test mode compresses every
# flight into a demo-friendly window while preserving relative ordering.
pigeon.airspeed-mph=${PIGEON_AIRSPEED_MPH:55.0}
pigeon.test-mode=${PIGEON_TEST_MODE:false}
pigeon.test-mode.min-seconds=${PIGEON_TEST_MIN_SECONDS:60}
pigeon.test-mode.max-seconds=${PIGEON_TEST_MAX_SECONDS:300}

# Profile. Defaults to prod so a deployment never boots seeded demo accounts by
# accident; run with SPRING_PROFILES_ACTIVE=demo for local development.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
