# Local development and demo only.
#
# This profile is never the default. It seeds known-credential accounts and
# enables the daily-pigeon reset, both of which would be serious problems in a
# real deployment, so everything here is deliberately scoped to a profile you
# have to ask for by name.

# Throwaway signing key for local runs. Any real environment must set JWT_SECRET.
jwt.secret=${JWT_SECRET:pigeon-local-development-only-key-not-for-any-real-deployment-hs256}

# Test-mode flights so a full send can be watched end to end in a minute or two
# instead of the real multi-hour duration.
pigeon.test-mode=true
pigeon.test-mode.min-seconds=${PIGEON_TEST_MIN_SECONDS:60}
pigeon.test-mode.max-seconds=${PIGEON_TEST_MAX_SECONDS:300}

# "Reset Daily Pigeon" developer control, so the one-a-day limit can be
# exercised repeatedly while testing.
pigeon.allow-daily-reset=true

spring.jpa.show-sql=false
