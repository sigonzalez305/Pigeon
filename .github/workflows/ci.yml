name: CI

# The audit that prompted this workflow found four defects sharing one root
# cause: the code typechecked and was never run. `tsc` passing had become the
# definition of done. These jobs are the cheapest gate that catches that class
# of bug — including asserting the production build actually emits its assets,
# which is how every sprite came to 404 in a green build.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pigeon-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pigeon-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assert the build emitted its sprite assets
        run: |
          count=$(find dist -type f \( -name '*.png' -o -name '*.webp' \) | wc -l)
          echo "Emitted image assets: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::The build emitted no image assets. Sprites will 404 in production."
            exit 1
          fi
      - name: Assert no dev-server paths were baked into the bundle
        run: |
          if grep -rq "/src/assets/" dist/assets/*.js; then
            echo "::error::A /src/ dev-server path reached the production bundle."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pigeon-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build
